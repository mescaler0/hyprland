# Hyprlock - Generated by wallust

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb({{color4 | strip}})
    inner_color = rgb({{background | strip}})
    font_color = rgb({{foreground | strip}})
    fade_on_empty = true
    placeholder_text = <span foreground="##{{foreground}}">Enter Password...</span>
    check_color = rgb({{color2 | strip}})
    fail_color = rgb({{color1 | strip}})
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb({{color3 | strip}})
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb({{foreground | strip}})
    font_size = 90
    font_family = Cascadia Code Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb({{foreground | strip}})
    font_size = 24
    font_family = Cascadia Code
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = rgb({{foreground | strip}})
    font_size = 20
    font_family = Cascadia Code
    position = 0, -280
    halign = center
    valign = center
}

label {
    monitor =
    text = Screen Locked
    color = rgb({{color4 | strip}})
    font_size = 16
    font_family = Cascadia Code
    position = 0, -350
    halign = center
    valign = center
}
