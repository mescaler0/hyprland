# Hypridle Configuration

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avvia hyprlock se non è già attivo
    before_sleep_cmd = loginctl lock-session    # Lock prima di suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Riaccendi monitor dopo suspend
    ignore_dbus_inhibit = false                 # Rispetta inibitori (media player, ecc)
}

# Listener 1: Dim screen dopo 2 minuti
listener {
    timeout = 120                                # 2 minuti
    on-timeout = brightnessctl -s set 10%       # Dim al 10%
    on-resume = brightnessctl -r                # Ripristina
}

# Listener 2: Spegni schermo dopo 5 minuti
listener {
    timeout = 300                                # 5 minuti
    on-timeout = hyprctl dispatch dpms off      # Spegni monitor
    on-resume = hyprctl dispatch dpms on        # Riaccendi monitor
}

# Listener 3: Lock screen dopo 8 minuti
listener {
    timeout = 480                                # 8 minuti
    on-timeout = loginctl lock-session          # Lock (triggera hyprlock)
}

# Listener 4: Suspend dopo 30 minuti
listener {
    timeout = 1800                               # 30 minuti
    on-timeout = systemctl suspend               # Suspend system
}
